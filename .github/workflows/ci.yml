name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:

permissions:
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.node-version }}-

      - name: Install
        run: npm ci

      # The codegen imports gate-backend definition modules whose
      # @transcodes-guard/core/* value imports resolve to the built core dist.
      # Build core first so a definition module may value-import any current
      # core export without depending on the committed dist's freshness.
      - name: Build core for codegen
        run: npm run build -w @transcodes-guard/core

      # Router codegen drift gate. Unlike dist (esbuild is non-reproducible, see
      # below), the per-host /transcodes command/skill files + router-body.ts are
      # pure deterministic templating from scripts/router-body.mjs, so a
      # byte-identity check is safe and catches hand-edits that bypass codegen.
      # MUST run BEFORE `build:plugin`: prebuild:plugin regenerates these same
      # files in write mode, so checking after the build would compare freshly
      # written output against itself and always pass (vacuous gate).
      - name: Verify router codegen is up to date
        run: node --import tsx scripts/generate-router-files.mjs --check

      - name: Build plugin
        run: npm run build:plugin

      # NOTE: byte-equality dist-sync gate intentionally removed.
      # We previously asserted `git diff --exit-code` on every dist/ dir to catch
      # stale committed bundles. That gate is unsatisfiable: the bundle output is
      # not byte-reproducible across build environments — esbuild embeds relative
      # module paths (e.g. `../../../node_modules/ajv/...`) into chunks, so npm
      # hoisting/layout differences between a contributor's machine and CI change
      # the content-hashed chunk filenames even when sources are identical. The
      # result was a permanently-red `dev` regardless of dist freshness.
      # Freshness is now guarded behind: (1) `npm run build:plugin` must succeed,
      # (2) the gitignore guard below (dist files physically exist), and (3) the
      # host smoke tests (20) which exercise the freshly-built hook entries.

      # gitignore negation guard: dist is ignored by default and only tracked
      # via `!plugins/*/dist/` + `!packages/*/dist/` negation globs. If a glob ever stops
      # matching, `git diff --exit-code` above silently passes (no diff) while
      # the dist is actually ignored — and hosts that clone get no runnable
      # files. Assert the compiled hook entries physically exist.
      - name: Verify plugin dist files exist (gitignore guard)
        run: |
          for f in plugins/*/dist/hooks/pre-tool-use.js; do
            test -f "$f" || { echo "::error::missing $f — dist may be gitignored"; exit 1; }
          done

      # ─────────────────────────────────────────────────────────
      # E2E hook harness (t6 Phase A): spawns the freshly-built dist hook
      # bundles as child processes against a per-test mock backend and pins
      # the gate's invariant contracts (built-in skip, gated entry, per-host
      # wire shapes, fail directions, raw-payload contract, Stop no-op,
      # evaluate-only request surface). Runs BEFORE the inline smokes; the
      # smokes stay until Phase C folds them in with a mapping table.
      - name: E2E hook harness (Phase A)
        run: npm run test:e2e

      # ─────────────────────────────────────────────────────────
      # Biome lint + format check (no --write).
      # Fails if any source file deviates from biome.json conventions or
      # contains lint errors. noRestrictedImports (gate-backend seam boundary)
      # is an error: only the plugins/*/backend.ts seams may import
      # @transcodes-guard/gate-backend (biome.json overrides).
      - name: Biome check
        run: npx biome check --reporter=github

      # ─────────────────────────────────────────────────────────
      # Firewall backstop for what biome cannot express.
      # noRestrictedImports matches only the literal specifier
      # "@transcodes-guard/gate-backend" — a deep subpath or a relative path
      # (../../gate-backend/src/…) passes biome clean. This grep denies any
      # import specifier that reaches into gate-backend from outside the
      # sanctioned seams (plugins/*/backend.ts, mcp/src/backend.ts) and the
      # package's own sources. scripts/tool-metadata.mts is the one codegen
      # seam: it reads tool definition METADATA at build time (never bundled,
      # handlers never invoked) to derive GUARD_TOOL_NAMES and the catalogs.
      - name: Firewall backstop — no gate-backend imports outside the seams
        run: |
          HITS=$(git grep -nE "from ['\"]([^'\"]*/)?gate-backend(/[^'\"]*)?['\"]" -- \
            ':!packages/gate-backend' \
            ':!plugins/*/backend.ts' \
            ':!mcp/src/backend.ts' \
            ':!scripts/tool-metadata.mts' \
            ':!*dist/*' \
            ':!package-lock.json' \
            ':!*.md' || true)
          if [ -n "$HITS" ]; then
            echo "::error::gate-backend import outside the sanctioned seams:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no out-of-seam gate-backend imports"

      # ─────────────────────────────────────────────────────────
      # Public-mirror surface gate.
      # Asserts each packages/* member keeps "private": true so nothing in
      # packages/ can leak out as a separate npm tarball (only plugins/* and
      # cli are published). If a future commit drops the flag, this step
      # fails loudly.
      - name: Public-mirror surface — workspace packages must stay isolated
        run: |
          MISSING=0
          for dir in packages/*/; do
            pkg=$(node -p "require('./${dir}package.json').name")
            is_private=$(node -p "require('./${dir}package.json').private === true")
            if [ "$is_private" != "true" ]; then
              echo "::error::${pkg} (${dir}) is missing \"private\": true"
              MISSING=1
            else
              echo "OK: ${pkg} marked private"
            fi
          done
          exit $MISSING

      # ─────────────────────────────────────────────────────────
      # Unit tests (node:test via tsx) — core suites (stepup + patterns) and
      # gate-backend mcp-tools suites.
      - name: core unit tests
        run: npm test -w @transcodes-guard/core -w @transcodes-guard/gate-backend

      # ─────────────────────────────────────────────────────────
      # mcp/ is not a workspace (standalone npm package published manually),
      # so turbo/npm -w never type-checks it. Check it explicitly here —
      # its deps resolve via the root node_modules workspace symlinks and
      # the workspace dist/ built by build:plugin above.
      - name: mcp standalone package type-check
        run: npx tsc --noEmit -p mcp/tsconfig.json

      # ─────────────────────────────────────────────────────────
      # Claude Code plugin smoke tests (8 scenarios, Guard v3 semantics).
      # The CI runner has NO Transcodes token and NO reachable backend, so the
      # states a smoke can reach are: no-token hook-skip,
      # backend-unreachable fail-closed deny,
      # and the token-free Stop no-op path. Allow (permission 1) and challenge
      # (permission 2 + sid/url) need a mock /guard/evaluate — deliberately out
      # of scope here (PRD smoke-suite-v3-respec P2).
      # All inputs are static JSON literals; no GitHub event injection
      # surface exists in this job.
      # ─────────────────────────────────────────────────────────

      - name: claude-code · no-token skips hook (Bash)
        run: |
          set -e
          # An unconfigured install must not gate local work. The hook exits
          # before classification when no token is available.
          OUT=$(echo '{"tool_name":"Bash","tool_input":{"command":"rm -rf /"},"cwd":"'"$PWD"'"}' \
            | node plugins/claude-code/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Hook did not exit 0 for no-token Bash"; exit 1; }
          if echo "$OUT" | grep -q '"permissionDecision"'; then
            echo "::error::No-token hook unexpectedly emitted a decision"; exit 1
          fi

      - name: claude-code · canonical transcodes-guard MCP name skips hook (poll wait)
        run: |
          set -e
          OUT=$(echo '{"tool_name":"tc_poll_stepup_session_wait","tool_input":{"sid":"ci-test-sid"}}' \
            | node plugins/claude-code/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Hook did not exit 0 for canonical transcodes MCP tool"; exit 1; }
          if echo "$OUT" | grep -q '"permissionDecision"'; then
            echo "::error::Canonical transcodes-guard MCP must skip the hook"; exit 1
          fi

      - name: claude-code · no-token skips non-meta built-in MCP (retire_member)
        run: |
          set -e
          # Token presence is checked before tool classification, so an
          # unconfigured install skips non-meta built-ins too.
          OUT=$(echo '{"tool_name":"tc_retire_member","tool_input":{"body":{"member_id":"m_ci_test"}}}' \
            | node plugins/claude-code/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Hook did not exit 0 for built-in MCP tool"; exit 1; }
          if echo "$OUT" | grep -q '"permissionDecision"'; then
            echo "::error::No-token built-in unexpectedly emitted a decision"; exit 1
          fi

      - name: claude-code · no-token skips non-meta built-in MCP (get_member)
        run: |
          set -e
          # Read-only built-ins follow the same pre-classification token check.
          OUT=$(echo '{"tool_name":"tc_get_member","tool_input":{"member_id":"x"}}' \
            | node plugins/claude-code/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Hook did not exit 0 for built-in MCP tool"; exit 1; }
          if echo "$OUT" | grep -q '"permissionDecision"'; then
            echo "::error::No-token built-in unexpectedly emitted a decision"; exit 1
          fi

      # Stop hook: local latch reminders removed. Coordinate SSOT is backend-only;
      # Stop must exit 0 with no reminder payload (agents recover via deny + poll wait).

      - name: claude-code · Stop hook is silent no-op
        run: |
          set -e
          mkdir -p "$HOME/.transcodes/state"
          NOW=$(node -e 'console.log(Date.now())')
          printf '{"group":"s_ci","createdAt":%s}' "$NOW" > "$HOME/.transcodes/state/grouping-session.json"
          printf '{"group":"s_ci","resource":"project","action":"update","sid":"tc_stepup_ci","createdAt":%s}' "$NOW" \
            > "$HOME/.transcodes/state/step-up.s_ci.project.update.json"
          OUT=$(printf '' | node plugins/claude-code/dist/hooks/stop.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Stop hook did not exit 0"; exit 1; }
          if echo "$OUT" | grep -q '"decision"'; then
            echo "::error::Stop hook unexpectedly emitted a reminder"; exit 1
          fi
          rm -f "$HOME/.transcodes/state/step-up.s_ci.project.update.json" "$HOME/.transcodes/state/grouping-session.json"

      - name: claude-code · external MCP + backend unreachable → fail-closed deny
        run: |
          set -e
          # Guard v3 fail-safe: an external mcp__* wire name is classified into the
          # hook and evaluated via POST /guard/evaluate. When the backend is
          # unreachable the gate must fail CLOSED (permission 2 → step-up), never
          # allow. A member token must exist or the hook short-circuits on no-token.
          mkdir -p "$HOME/.transcodes/state"
          TOKEN=$(node -e 'const p=Buffer.from(JSON.stringify({oid:"org-ci",pid:"proj-ci",mid:"m-ci",aud:["transcodes-mcp"],exp:Math.floor(Date.now()/1000)+3600})).toString("base64url");console.log("eyJhbGciOiJub25lIn0."+p+".x")')
          printf '{"token":"%s","guard_enabled":true}' "$TOKEN" > "$HOME/.transcodes/config.json"
          OUT=$(echo '{"tool_name":"mcp__external_server__delete_thing","tool_input":{"id":"x"}}' \
            | TRANSCODES_BACKEND_URL=http://127.0.0.1:9 node plugins/claude-code/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Hook did not exit 0 for unreachable-backend case"; exit 1; }
          echo "$OUT" | grep -q '"permissionDecision":"deny"' || { echo "::error::External MCP did not fail closed when backend was unreachable"; exit 1; }
          rm -f "$HOME/.transcodes/config.json" "$HOME/.transcodes/state"/step-up.*.json "$HOME/.transcodes/state/grouping-session.json"

      # ─────────────────────────────────────────────────────────
      # Codex CLI plugin smoke tests (3 scenarios — minimum coverage that
      # proves wire-format parity. Codex's hooks share the same core/stepup
      # evaluate function, so we focus on adapter correctness rather than
      # repeating every scenario from the claude-code suite.)
      # ─────────────────────────────────────────────────────────

      - name: codex · no-token skips hook (Bash)
        run: |
          set -e
          OUT=$(echo '{"tool_name":"Bash","tool_input":{"command":"rm -rf /"},"cwd":"'"$PWD"'"}' \
            | node plugins/codex/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Codex hook did not exit 0 for no-token Bash"; exit 1; }
          if echo "$OUT" | grep -q '"permissionDecision"'; then
            echo "::error::Codex no-token hook unexpectedly emitted a decision"; exit 1
          fi

      - name: codex · backend unreachable → fail-closed deny (external MCP)
        run: |
          set -e
          # With a token present but /guard/evaluate unreachable, the verdict is
          # null → permission 2 → BLOCK_STEPUP_CREATE_FAILED deny (fail-closed).
          # Distinct from the no-token path: exercises the token parse + evaluate
          # round-trip + the CREATE_FAILED deny formatting through the codex adapter.
          mkdir -p "$HOME/.transcodes/state"
          TOKEN=$(node -e 'const p=Buffer.from(JSON.stringify({oid:"org-ci",pid:"proj-ci",mid:"m-ci",aud:["transcodes-mcp"],exp:Math.floor(Date.now()/1000)+3600})).toString("base64url");console.log("eyJhbGciOiJub25lIn0."+p+".x")')
          printf '{"token":"%s","guard_enabled":true}' "$TOKEN" > "$HOME/.transcodes/config.json"
          OUT=$(echo '{"tool_name":"mcp__external_server__delete_thing","tool_input":{"id":"x"}}' \
            | TRANSCODES_BACKEND_URL=http://127.0.0.1:9 node plugins/codex/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Codex hook did not exit 0 for unreachable-backend case"; exit 1; }
          echo "$OUT" | grep -q '"permissionDecision":"deny"' || { echo "::error::Codex did not fail closed when backend was unreachable"; exit 1; }
          rm -f "$HOME/.transcodes/config.json" "$HOME/.transcodes/state"/step-up.*.json "$HOME/.transcodes/state/grouping-session.json"

      - name: codex · Stop hook clean state
        run: |
          set -e
          rm -f "$HOME/.transcodes/state"/step-up.*.json "$HOME/.transcodes/state/grouping-session.json"
          OUT=$(printf '' | node plugins/codex/dist/hooks/stop.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Codex Stop hook did not exit 0"; exit 1; }
          if echo "$OUT" | grep -q '"decision":"block"'; then
            echo "::error::Codex Stop hook unexpectedly emitted a block reminder on clean state"; exit 1
          fi

      # ─────────────────────────────────────────────────────────
      # Antigravity 2.0 plugin smoke tests (5 scenarios — wire format is
      # different from Claude Code/Codex (top-level `decision` instead of
      # `hookSpecificOutput.permissionDecision`, nested `toolCall.name`/
      # `toolCall.args` stdin), so we cover the verb mismatch + the
      # PreInvocation hybrid that subsumes SessionStart + UserPromptSubmit.
      # See docs/research/antigravity-e2e-findings.md for the 4 unknowns
      # pending manual binary validation before public release.)
      # ─────────────────────────────────────────────────────────

      - name: antigravity · no-token skips hook (run_command)
        run: |
          set -e
          OUT=$(echo '{"toolCall":{"name":"run_command","args":{"CommandLine":"rm -rf /","Cwd":"'"$PWD"'"}},"stepIdx":0,"conversationId":"ag-ci","workspacePaths":["'"$PWD"'"]}' \
            | node plugins/antigravity/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Antigravity hook did not exit 0 for no-token run_command"; exit 1; }
          if echo "$OUT" | grep -q '"decision"\|"hookSpecificOutput"'; then
            echo "::error::Antigravity no-token hook unexpectedly emitted a decision"; exit 1
          fi

      - name: antigravity · backend unreachable → fail-closed deny (run_command)
        run: |
          set -e
          # Token present + /guard/evaluate unreachable → BLOCK_STEPUP_CREATE_FAILED
          # deny through the antigravity adapter (top-level decision wire format).
          mkdir -p "$HOME/.transcodes/state"
          TOKEN=$(node -e 'const p=Buffer.from(JSON.stringify({oid:"org-ci",pid:"proj-ci",mid:"m-ci",aud:["transcodes-mcp"],exp:Math.floor(Date.now()/1000)+3600})).toString("base64url");console.log("eyJhbGciOiJub25lIn0."+p+".x")')
          printf '{"token":"%s","guard_enabled":true}' "$TOKEN" > "$HOME/.transcodes/config.json"
          OUT=$(echo '{"toolCall":{"name":"run_command","args":{"CommandLine":"rm -rf /tmp/x","Cwd":"'"$PWD"'"}},"stepIdx":0,"conversationId":"ag-ci","workspacePaths":["'"$PWD"'"]}' \
            | TRANSCODES_BACKEND_URL=http://127.0.0.1:9 node plugins/antigravity/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Antigravity hook did not exit 0 for unreachable-backend case"; exit 1; }
          echo "$OUT" | grep -q '"decision":"deny"' || { echo "::error::Antigravity did not fail closed when backend was unreachable"; exit 1; }
          rm -f "$HOME/.transcodes/config.json" "$HOME/.transcodes/state"/step-up.*.json "$HOME/.transcodes/state/grouping-session.json"

      - name: antigravity · Stop hook clean state
        run: |
          set -e
          rm -f "$HOME/.transcodes/state"/step-up.*.json "$HOME/.transcodes/state/grouping-session.json"
          OUT=$(printf '' | node plugins/antigravity/dist/hooks/stop.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Antigravity Stop hook did not exit 0"; exit 1; }
          if echo "$OUT" | grep -q '"decision":"continue"'; then
            echo "::error::Antigravity Stop hook unexpectedly emitted a continue reminder on clean state"; exit 1
          fi

      - name: antigravity · PreInvocation invocationNum=0 injects primer
        run: |
          set -e
          OUT=$(echo '{"invocationNum":0,"initialNumSteps":0,"conversationId":"ag-ci","transcriptPath":"/tmp/ag-ci-nonexistent.jsonl","workspacePaths":["'"$PWD"'"]}' \
            | node plugins/antigravity/dist/hooks/pre-invocation.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Antigravity PreInvocation did not exit 0"; exit 1; }
          echo "$OUT" | grep -q '"injectSteps"' || { echo "::error::Antigravity PreInvocation missed primer injectSteps on invocationNum=0"; exit 1; }
          # Match the stable primer heading ("transcodes-guard step-up MFA
          # protocol:") — the old 'protocol primer' wording drifted while this
          # step was hidden behind the Stop-smoke failure (skipped on dev).
          echo "$OUT" | grep -q 'step-up MFA protocol' || { echo "::error::Antigravity PreInvocation primer content missing"; exit 1; }

      - name: antigravity · PreInvocation invocationNum=1 no primer
        run: |
          set -e
          OUT=$(echo '{"invocationNum":1,"initialNumSteps":1,"conversationId":"ag-ci"}' \
            | node plugins/antigravity/dist/hooks/pre-invocation.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Antigravity PreInvocation did not exit 0 (n=1)"; exit 1; }
          if echo "$OUT" | grep -q '"injectSteps"'; then
            echo "::error::Antigravity PreInvocation should NOT inject primer on invocationNum=1"; exit 1
          fi

      # ─────────────────────────────────────────────────────────
      # Cursor IDE plugin smoke tests (6 scenarios — wire format is FLAT
      # `{permission, user_message, agent_message}` (no hookSpecificOutput
      # wrapper) and Stop uses `followup_message` instead of `decision:
      # "block"`. beforeSubmitPrompt has no additional_context channel and
      # prompt-group rotation is retired (v3 no-op) — the test verifies the
      # always-`{ continue: true }` output and that legacy grouping state
      # is left untouched.)
      # ─────────────────────────────────────────────────────────

      - name: cursor · no-token skips hook (Shell)
        run: |
          set -e
          OUT=$(echo '{"tool_name":"Shell","tool_input":{"command":"rm -rf /"},"cwd":"'"$PWD"'"}' \
            | node plugins/cursor/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Cursor hook did not exit 0 for no-token Shell"; exit 1; }
          if echo "$OUT" | grep -q '"permission"\|"hookSpecificOutput"'; then
            echo "::error::Cursor no-token hook unexpectedly emitted a decision"; exit 1
          fi

      - name: cursor · beforeShellExecution native stdin (command top-level, no tool_name)
        run: |
          set -e
          OUT=$(echo '{"command":"find /tmp","cwd":"'"$PWD"'","hook_event_name":"beforeShellExecution"}' \
            | node plugins/cursor/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Cursor native stdin hook did not exit 0"; exit 1; }
          echo "$OUT" | grep -q '"permission":"deny"' || { echo "::error::Cursor native stdin should reach gate (deny), not bypass"; exit 1; }

      - name: cursor · backend unreachable → fail-closed deny (Shell)
        run: |
          set -e
          # Token present + /guard/evaluate unreachable → BLOCK_STEPUP_CREATE_FAILED
          # deny through the cursor adapter (flat permission wire format).
          mkdir -p "$HOME/.transcodes/state"
          TOKEN=$(node -e 'const p=Buffer.from(JSON.stringify({oid:"org-ci",pid:"proj-ci",mid:"m-ci",aud:["transcodes-mcp"],exp:Math.floor(Date.now()/1000)+3600})).toString("base64url");console.log("eyJhbGciOiJub25lIn0."+p+".x")')
          printf '{"token":"%s","guard_enabled":true}' "$TOKEN" > "$HOME/.transcodes/config.json"
          OUT=$(echo '{"tool_name":"Shell","tool_input":{"command":"rm -rf /tmp/x"},"cwd":"'"$PWD"'"}' \
            | TRANSCODES_BACKEND_URL=http://127.0.0.1:9 node plugins/cursor/dist/hooks/pre-tool-use.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Cursor hook did not exit 0 for unreachable-backend case"; exit 1; }
          echo "$OUT" | grep -q '"permission":"deny"' || { echo "::error::Cursor did not fail closed when backend was unreachable"; exit 1; }
          rm -f "$HOME/.transcodes/config.json" "$HOME/.transcodes/state"/step-up.*.json "$HOME/.transcodes/state/grouping-session.json"

      - name: cursor · sessionStart no-token notice → additional_context
        run: |
          set -e
          # v3 sessionStart reads no on-disk step-up state; with no token it
          # emits the install notice via the flat additional_context channel.
          rm -f "$HOME/.transcodes/config.json"
          OUT=$(printf '' | node plugins/cursor/dist/hooks/session-start.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Cursor sessionStart hook did not exit 0"; exit 1; }
          echo "$OUT" | grep -q '"additional_context"' || { echo "::error::Cursor sessionStart missing flat additional_context"; exit 1; }
          if echo "$OUT" | grep -q '"hookSpecificOutput"'; then
            echo "::error::Cursor sessionStart wrongly emitted hookSpecificOutput wrapper"; exit 1
          fi
          rm -f "$HOME/.transcodes/state/grouping-session.json"

      - name: cursor · Stop hook clean state
        run: |
          set -e
          rm -f "$HOME/.transcodes/state"/step-up.*.json "$HOME/.transcodes/state/grouping-session.json"
          OUT=$(printf '' | node plugins/cursor/dist/hooks/stop.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Cursor Stop hook did not exit 0"; exit 1; }
          if echo "$OUT" | grep -q '"followup_message"'; then
            echo "::error::Cursor Stop hook unexpectedly emitted followup_message on clean state"; exit 1
          fi

      - name: cursor · beforeSubmitPrompt emits continue:true (prompt-group retired → no-op)
        run: |
          set -e
          # Guard v3 (0.50.0, t1 §6): prompt groups are retired — the entry
          # still calls sweepLatches()/rotatePromptGroup(), but both are
          # explicit no-ops in gate-backend (dedupe/grouping is backend-owned
          # via Redis SET NX). The v3 contract is therefore: always
          # {continue:true} + exit 0, and a legacy grouping-session.json is
          # left UNTOUCHED. Asserting the old rotation would demand behavior
          # v3 deliberately removed.
          mkdir -p "$HOME/.transcodes/state"
          NOW=$(node -e 'console.log(Date.now())')
          printf '{"group":"s_before","createdAt":%s}' "$NOW" > "$HOME/.transcodes/state/grouping-session.json"
          OUT=$(echo '{"prompt":"인증 완료"}' \
            | node plugins/cursor/dist/hooks/before-submit-prompt.js 2>&1; printf '\nEXIT:%s' "$?")
          echo "$OUT"
          echo "$OUT" | grep -q "EXIT:0" || { echo "::error::Cursor beforeSubmitPrompt did not exit 0"; exit 1; }
          echo "$OUT" | grep -q '"continue":true' || { echo "::error::Cursor beforeSubmitPrompt missed continue:true"; exit 1; }
          GROUP=$(node -p "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.transcodes/state/grouping-session.json', 'utf8')).group")
          [ "$GROUP" = "s_before" ] || { echo "::error::beforeSubmitPrompt touched the legacy grouping file (rotation is retired in v3 — no-op expected)"; exit 1; }
          rm -f "$HOME/.transcodes/state/grouping-session.json"
